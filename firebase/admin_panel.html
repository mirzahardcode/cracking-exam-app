<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel - MIRZTHAX</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: #f4f6f8;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 28px;
            color: #1a1a2e;
            border-bottom: 3px solid #4CAF50;
            padding-bottom: 12px;
            margin-bottom: 25px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-top: -10px;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            background: #f9fafb;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .form-grid input {
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }

        .form-grid button {
            padding: 10px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
        }

        .form-grid button:hover {
            background: #388E3C;
        }

        .btn-danger {
            background: #e53935 !important;
        }

        .btn-danger:hover {
            background: #c62828 !important;
        }

        .btn-warning {
            background: #ff9800 !important;
        }

        .btn-warning:hover {
            background: #e68900 !important;
        }

        .table-wrap {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            background: #1a1a2e;
            color: white;
            padding: 12px 10px;
            text-align: left;
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid #e0e0e0;
        }

        .badge {
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-active {
            background: #c8e6c9;
            color: #2e7d32;
        }

        .badge-banned {
            background: #ffcdd2;
            color: #c62828;
        }

        .badge-expired {
            background: #fff3e0;
            color: #e65100;
        }

        .status-text {
            font-size: 13px;
        }

        .action-btn {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-right: 5px;
            font-size: 12px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #323232;
            color: white;
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            opacity: 0;
            transition: 0.4s;
            pointer-events: none;
            z-index: 999;
        }

        .toast.show {
            opacity: 1;
        }

        .toast-success {
            background: #2e7d32;
        }
        .toast-error {
            background: #c62828;
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            color: #999;
            font-size: 13px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .footer span {
            color: #4CAF50;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .container { padding: 15px; }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🛡️ Admin Panel — MIRZTHAX</h1>
    <div class="subtitle">Manage users, HWID binding, ban/unban, and expiration.</div>

    <!-- FORM TAMBAH USER -->
    <div class="form-grid">
        <input type="text" id="username" placeholder="Username" />
        <input type="text" id="password" placeholder="Password" />
        <input type="text" id="expired" placeholder="Expired (YYYY-MM-DD)" />
        <button id="btnAddUser">➕ Tambah User</button>
        <button id="btnRefresh" class="btn-warning" style="background:#ff9800;">🔄 Refresh</button>
    </div>

    <!-- TABLE USER -->
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Password</th>
                    <th>HWID</th>
                    <th>Expired</th>
                    <th>Status</th>
                    <th style="text-align:center;">Action</th>
                </tr>
            </thead>
            <tbody id="userTableBody">
                <tr><td colspan="6" style="text-align:center; color:#999;">Loading users...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="footer">
        Made with ❤️ by <span>MIRZTHAX</span> &amp; kmgppputz_
    </div>
</div>

<!-- TOAST NOTIFICATION -->
<div id="toast" class="toast"></div>

<script>
    // ============================================================
    // 🔥 FIREBASE CONFIG — GANTI DENGAN MILIK SENDIRI!
    // ============================================================
    const FIREBASE_URL = "https://ujianxthax-default-rtdb.asia-southeast1.firebasedatabase.app/";
    const USERS_PATH = FIREBASE_URL + "users.json";

    // ============================================================
    // 🛠️ UTILITY FUNCTIONS
    // ============================================================

    function showToast(msg, type = '') {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'toast show ' + (type === 'success' ? 'toast-success' : type === 'error' ? 'toast-error' : '');
        clearTimeout(t._hide);
        t._hide = setTimeout(() => t.classList.remove('show'), 3000);
    }

    function getVal(id) {
        return document.getElementById(id).value.trim();
    }

    function clearForm() {
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
        document.getElementById('expired').value = '';
    }

    // ============================================================
    // 📥 FETCH USERS FROM FIREBASE
    // ============================================================

    async function loadUsers() {
        try {
            const res = await fetch(USERS_PATH);
            if (!res.ok) throw new Error('Gagal fetch data');
            const data = await res.json();
            renderTable(data);
        } catch (err) {
            showToast('Error: ' + err.message, 'error');
            document.getElementById('userTableBody').innerHTML = `<tr><td colspan="6" style="text-align:center; color:#c62828;">Gagal load data</td></tr>`;
        }
    }

    // ============================================================
    // 🖥️ RENDER TABLE
    // ============================================================

    function renderTable(data) {
        const tbody = document.getElementById('userTableBody');
        if (!data || Object.keys(data).length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#999;">Belum ada user</td></tr>`;
            return;
        }

        let html = '';
        const now = new Date().toISOString().slice(0, 10);

        for (const [username, user] of Object.entries(data)) {
            const expired = user.expired || 'N/A';
            const hwid = user.hwid || '-';
            const banned = user.banned === true;

            let statusBadge = '<span class="badge badge-active">✅ Active</span>';
            if (banned) statusBadge = '<span class="badge badge-banned">🚫 Banned</span>';
            else if (expired !== 'N/A' && expired < now) statusBadge = '<span class="badge badge-expired">⏳ Expired</span>';

            html += `
                <tr>
                    <td><strong>${username}</strong></td>
                    <td>${user.password || '??'}</td>
                    <td style="font-family: monospace; font-size:12px;">${hwid}</td>
                    <td>${expired}</td>
                    <td>${statusBadge}</td>
                    <td style="text-align:center; white-space:nowrap;">
                        <button class="action-btn btn-danger" onclick="banUser('${username}')">🚫 Ban</button>
                        <button class="action-btn" style="background:#4CAF50;color:white;" onclick="unbanUser('${username}')">✅ Unban</button>
                        <button class="action-btn btn-warning" onclick="deleteUser('${username}')" style="background:#e53935;color:white;">🗑️ Hapus</button>
                    </td>
                </tr>
            `;
        }

        tbody.innerHTML = html;
    }

    // ============================================================
    // ➕ ADD USER
    // ============================================================

    async function addUser() {
        const username = getVal('username');
        const password = getVal('password');
        const expired = getVal('expired');

        if (!username || !password || !expired) {
            showToast('Semua field harus diisi!', 'error');
            return;
        }

        if (!/^\d{4}-\d{2}-\d{2}$/.test(expired)) {
            showToast('Format expired harus YYYY-MM-DD', 'error');
            return;
        }

        const newUser = {
            password: password,
            hwid: "",
            expired: expired,
            banned: false,
            created_at: new Date().toISOString()
        };

        try {
            const res = await fetch(FIREBASE_URL + `users/${username}.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newUser)
            });

            if (!res.ok) throw new Error('Gagal tambah user');
            showToast(`User ${username} berhasil ditambahkan!`, 'success');
            clearForm();
            loadUsers();
        } catch (err) {
            showToast('Error: ' + err.message, 'error');
        }
    }

    // ============================================================
    // 🚫 BAN / UNBAN / DELETE
    // ============================================================

    async function banUser(username) {
        if (!confirm(`Ban user "${username}"?`)) return;
        try {
            const res = await fetch(FIREBASE_URL + `users/${username}/banned.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(true)
            });
            if (!res.ok) throw new Error('Gagal ban user');
            showToast(`${username} berhasil di-ban!`, 'success');
            loadUsers();
        } catch (err) {
            showToast('Error: ' + err.message, 'error');
        }
    }

    async function unbanUser(username) {
        try {
            const res = await fetch(FIREBASE_URL + `users/${username}/banned.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(false)
            });
            if (!res.ok) throw new Error('Gagal unban user');
            showToast(`${username} berhasil di-unban!`, 'success');
            loadUsers();
        } catch (err) {
            showToast('Error: ' + err.message, 'error');
        }
    }

    async function deleteUser(username) {
        if (!confirm(`Hapus user "${username}" permanen?`)) return;
        try {
            const res = await fetch(FIREBASE_URL + `users/${username}.json`, {
                method: 'DELETE'
            });
            if (!res.ok) throw new Error('Gagal hapus user');
            showToast(`${username} berhasil dihapus!`, 'success');
            loadUsers();
        } catch (err) {
            showToast('Error: ' + err.message, 'error');
        }
    }

    // ============================================================
    // 🔄 EVENT LISTENERS
    // ============================================================

    document.getElementById('btnAddUser').addEventListener('click', addUser);
    document.getElementById('btnRefresh').addEventListener('click', loadUsers);

    // Enter key untuk submit form
    document.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') addUser();
    });

    // ============================================================
    // 🚀 INIT
    // ============================================================

    loadUsers();
</script>
</body>
</html>
